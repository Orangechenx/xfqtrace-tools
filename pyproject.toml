[project]
name = "xfqtrace-tools"
version = "1.3.2"
description = "真机 Android NDK 指令级 trace — CLI + MCP Server（xfQTrace v1.3 配套工具）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "xfq (LunFengChen)", email = "i@xfq.fun"},
]
keywords = [
    "android", "reverse-engineering", "trace", "frida", "qbdi", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/Orangechenx/xfqtrace-tools"
Repository = "https://github.com/Orangechenx/xfqtrace-tools"
Documentation = "https://github.com/Orangechenx/xfqtrace-tools#readme"

[project.scripts]
xfqtrace = "xfqtrace.cli:app"
xfq = "xfqtrace.cli:app"

[tool.setuptools]
packages = {find = {include = ["xfqtrace", "xfqtrace.*"]}}

[tool.setuptools.package-data]
xfqtrace = ["_vendor/**/*.js", "_vendor/**/*.md", "_vendor/*.exe"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
